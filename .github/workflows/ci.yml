name: CI

# Builds and tests everything that is not the mobile app.
#
# The app is excluded through Prana.NoApp.slnf rather than being left out of the solution. It
# needs the MAUI workloads, an Android SDK and a JDK, and making every pull request install
# those would be a tax on work that never touches the app. build-app.yml builds it instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Prana.NoApp.slnf

      - name: Build
        run: dotnet build Prana.NoApp.slnf --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      # xunit v3 runs on Microsoft.Testing.Platform, selected by the "test" section in
      # global.json. That runner takes the solution by flag rather than as an argument.
      - name: Test
        run: dotnet test --solution Prana.NoApp.slnf --configuration Release --no-build

      - name: Check formatting
        run: dotnet format Prana.NoApp.slnf --verify-no-changes --no-restore

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required documents are present
        run: |
          missing=0
          for f in README.md LICENSE LICENSE-DATA NOTICE CONTRIBUTING.md \
                   CODE_OF_CONDUCT.md GOVERNANCE.md SECURITY.md \
                   DATA_POLICY.md DATA_SOURCES.md; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::required document is missing"
              missing=1
            fi
          done
          exit $missing

      # A project missing from the solution still builds when someone runs it directly, so the
      # only visible symptom is that its tests quietly stop running in CI. That happened once,
      # to the importer, and nothing failed to say so.
      - name: Every project is in the solution
        run: |
          missing=0
          for project in $(find src tools tests app -name '*.csproj'); do
            name=$(basename "$project")
            if ! grep -q "$name" Prana.sln; then
              echo "::error file=Prana.sln::$project is not in Prana.sln, so CI never builds or tests it."
              missing=1
            fi
          done

          # The filter is what CI actually builds, so a new non-app project missing from it would
          # also never be built, with the same silent symptom.
          for project in $(find src tools tests -name '*.csproj'); do
            name=$(basename "$project")
            if ! grep -q "$name" Prana.NoApp.slnf; then
              echo "::error file=Prana.NoApp.slnf::$project is not in the CI solution filter, so CI never builds it."
              missing=1
            fi
          done

          exit $missing

      - name: No credentials committed
        run: |
          # A blunt guard. The real protection is that the app never needs a token,
          # but a mistake here is expensive enough to be worth catching early.
          if grep -rInE '(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               --exclude-dir=.git --exclude-dir=docs . ; then
            echo "::error::possible credential found in the repository"
            exit 1
          fi
          echo "No credential patterns found."
