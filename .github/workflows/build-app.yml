name: Build app

# Builds the Prana app.
#
# Separate from ci.yml because the app needs the MAUI workloads, an Android SDK and a JDK, none
# of which the rest of the repository requires. Making every pull request pay for that would be
# a tax on work that never touches the app.
#
# Android is what ships. iOS is built only to prove that platform-specific code has not leaked
# into shared layers, which is the whole point of ADR-0004.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/Prana.Core/**"
      - ".github/workflows/build-app.yml"
  pull_request:
    paths:
      - "app/**"
      - "src/Prana.Core/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Android manifest merging runs on the JVM and needs 17. A machine with 11 fails deep in
      # the Android targets with UnsupportedClassVersionError and a class file version number,
      # which says nothing about the actual problem.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android --skip-sign-check

      # Only -f here, never -p:TargetFrameworks. A global property flows into project references
      # as well, so overriding it rewrites Prana.Core's target framework too and the build fails
      # with NETSDK1005 about a missing net10.0 target. The project drops iOS on Linux by an OS
      # condition instead, which stays local to the project that needs it.
      - name: Build
        run: dotnet build app/Prana.Mobile/Prana.Mobile.csproj -f net10.0-android -c Release -p:ContinuousIntegrationBuild=true

      # A Release APK, not a Debug one. A Debug Android build uses fast deployment: the managed
      # assemblies are pushed separately by adb rather than packaged, so the APK contains no
      # managed code at all. It installs happily and then dies the instant it launches. That is
      # what shipped from this job before, and it is not something a person can be expected to
      # diagnose from an artifact download.
      #
      # Signed with the Android debug key, which is enough to sideload. Real release signing is
      # F17 and needs a key that does not exist yet.
      - name: Package an installable APK
        run: dotnet build app/Prana.Mobile/Prana.Mobile.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk

      # The guard for the mistake above. It asks the only question that matters, whether the
      # package contains managed code at all, rather than asserting one particular layout: the
      # first version of this check demanded an assembly store blob, which Windows produces and
      # the Linux runner does not, and it failed a perfectly good APK.
      #
      # The broken Debug package had none of these, which is what makes the check meaningful.
      - name: The APK actually contains the app
        run: |
          apk=$(find app/Prana.Mobile/bin/Release/net10.0-android -name '*-Signed.apk' | head -1)

          if [ -z "$apk" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

          echo "APK: $apk ($(du -h "$apk" | cut -f1))"

          listing=$(unzip -l "$apk")
          blob=$(echo "$listing" | grep -c 'blob' || true)
          aot=$(echo "$listing"  | grep -c 'libaot-' || true)
          store=$(echo "$listing" | grep -c 'assemblies/' || true)
          dll=$(echo "$listing"  | grep -c '\.dll$' || true)

          echo "managed code: blob=$blob libaot=$aot assemblies/=$store dll=$dll"

          if [ "$((blob + aot + store + dll))" -eq 0 ]; then
            echo "::error file=.github/workflows/build-app.yml::This APK contains no managed code in any form, so it will crash on launch with 'No assemblies found'. A Debug build does this, because fast deployment pushes assemblies over adb instead of packaging them."
            exit 1
          fi

          if ! echo "$listing" | grep -q 'assets/catalogue-starter.db.br'; then
            echo "::error::The bundled starter catalogue is missing from the APK."
            exit 1
          fi

          echo "Contains managed code and the bundled catalogue."

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: prana-apk
          path: app/Prana.Mobile/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS compile check
    # macOS runners are billed at a premium on private repositories and are free on public ones.
    # This repository is public, so the check costs nothing but time.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Both workloads, even though only iOS is built. macOS keeps Android in the project's
      # target frameworks, and restore resolves every one of them regardless of which is built.
      - name: Install the MAUI workloads
        run: dotnet workload install maui-android maui-ios --skip-sign-check

      # Compile only. There is no Apple signing identity and no distribution in Phase 1; this
      # exists to catch platform-specific code leaking into shared layers, early, while the app
      # is small enough that the cause is obvious.
      - name: Build
        run: dotnet build app/Prana.Mobile/Prana.Mobile.csproj -f net10.0-ios -c Release -p:ContinuousIntegrationBuild=true
