name: Import Open Food Facts

# Brings the Open Food Facts export into the repository and opens a pull request with the
# result.
#
# This runs here rather than on a maintainer machine on purpose. The export is over a gigabyte,
# so an import that depends on one person having downloaded it is not something a fork can
# reproduce. A runner has fast access to the source and no state of its own, which is exactly
# what a reproducible import needs.
#
# Nothing merges automatically. The output is a pull request that a person reads.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Stop after this many records. 0 imports everything. Use a small number for a smoke run."
        required: false
        default: "0"
      dry_run:
        description: "Map and report, write nothing."
        type: boolean
        required: false
        default: false
  schedule:
    # Monthly. Formulations and the upstream dataset both change slowly, and a pull request
    # nobody has time to review is worse than no pull request.
    - cron: "23 4 1 * *"

permissions:
  contents: read

concurrency:
  group: import-openfoodfacts
  cancel-in-progress: false

env:
  # The JSONL export, not the smaller tab separated one. The tab separated export publishes
  # only normalised per-100g columns and has no nutrition_data_per field, so importing it would
  # label every product as per 100 g whether or not that is what the packet declared. See
  # ADR-0023 and DATA_SOURCES.md.
  DUMP_URL: https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz

jobs:
  import:
    name: Import and open a pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the tools
        run: |
          dotnet build tools/Prana.Tools.Importer --configuration Release
          dotnet build tools/Prana.Tools.Validator --configuration Release

      - name: Import, streaming the export straight from the network
        id: import
        run: |
          # The JSONL export is around 12 GB compressed and far larger expanded, which does not
          # fit on a runner. So it is never stored: curl pipes it directly into the importer,
          # which detects the gzip and decompresses as it reads. Nothing larger than a single
          # product is held at any point.
          set -o pipefail

          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          if [ -n "${{ inputs.limit }}" ] && [ "${{ inputs.limit }}" != "0" ]; then
            args="$args --limit ${{ inputs.limit }}"
          fi

          curl --fail --location --show-error --silent \
            --retry 5 --retry-delay 15 --retry-all-errors \
            --user-agent "Prana-Importer (https://github.com/jatin23pasrija/prana)" \
            "$DUMP_URL" \
          | dotnet tools/Prana.Tools.Importer/bin/Release/net10.0/prana-import.dll import \
              --dump - \
              --retrieved-at "$(date -u +%Y-%m-%d)" \
              --url "$DUMP_URL" \
              --report import-report.json \
              --gaps import-gaps.json \
              $args | tee import-log.txt

      - name: Validate everything that was written
        if: inputs.dry_run != true
        run: |
          dotnet tools/Prana.Tools.Validator/bin/Release/net10.0/prana-validate.dll \
            validate data --format github

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: import-report
          path: |
            import-report.json
            import-gaps.json
            import-log.txt
          retention-days: 30

      # The importer reports how many records it actually wrote. If far more files changed than
      # that, something is rewriting records it should have left alone, and the result is a pull
      # request too large to review. That is not hypothetical: the first monthly re-import
      # stamped a fresh date on all 26,578 records and opened a 31,749-file pull request for
      # 127 genuinely new products.
      - name: Check the diff matches what was written
        if: inputs.dry_run != true
        run: |
          written=$(jq -r '.written' import-report.json)
          rejected=$(jq -r '.rejected_by_validator' import-report.json)
          changed=$(git status --porcelain data/products | wc -l)

          # Rejected records are deleted after being written, so they show up as changes too.
          # The rest of the margin is for reference data moving under data/products.
          budget=$(( written + rejected + 50 ))

          echo "Wrote $written, rejected $rejected, $changed product files changed (budget $budget)."

          if [ "$changed" -gt "$budget" ]; then
            echo "::error::$changed product files changed but only $written records were written."
            echo "The importer is rewriting records whose product did not change. See ADR-0032."
            exit 1
          fi

      - name: Open a pull request
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain data sources)" ]; then
            echo "The import produced no changes. Nothing to open."
            exit 0
          fi

          # The run number keeps two imports on the same day apart. A purely date-based name
          # meant a second run pushed into the branch of a pull request that was still open,
          # silently stacking two imports into one review.
          branch="bot/import-openfoodfacts-$(date -u +%Y%m%d)-${{ github.run_number }}"

          git config user.name "prana-import"
          git config user.email "noreply@github.com"
          git checkout -b "$branch"
          git add data sources
          git commit -m "data: import Open Food Facts, $(date -u +%Y-%m-%d)

          $(head -20 import-log.txt)

          Generated by .github/workflows/import-openfoodfacts.yml.
          Data from Open Food Facts, ODbL 1.0 (database) and DbCL 1.0 (contents)."

          git push --set-upstream origin "$branch"

          # The import validates its own output above, before this point, so a broken import
          # never reaches a pull request. CI and validate-data also run on the pull request
          # itself, which was confirmed on the first real import.
          gh pr create \
            --base main \
            --head "$branch" \
            --title "data: Open Food Facts import, $(date -u +%Y-%m-%d)" \
            --body "$(cat <<EOF
          Automated import from Open Food Facts.

          ## What ran

          Source: \`$DUMP_URL\`
          Snapshot recorded in \`sources/openfoodfacts/snapshot.json\`.

          ## Result

          \`\`\`
          $(cat import-log.txt | tail -40)
          \`\`\`

          The full report is attached to [the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) as an artifact.

          ## Before merging

          - Validation already ran over this exact content in the workflow above, and CI and
            validate-data run on this pull request as well. Check both before merging.
          - Every record here is \`unverified\` with \`medium\` confidence. That is deliberate:
            Open Food Facts is community-entered, and calling it verified would make our own
            verification vocabulary meaningless.
          - Some records have a name and nothing else. Those are kept on purpose, and the run
            artifact \`import-gaps.json\` lists them. They are the seed work queue for the
            research automation, not failures.
          - Spot-check a handful of records against real packaging before merging.
          EOF
          )"
